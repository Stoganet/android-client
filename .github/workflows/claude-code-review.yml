name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_dispatch:

jobs:
  claude-review:
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !startsWith(github.event.pull_request.title, 'chore(deps): bump ') &&
      !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Read CLAUDE.md, then review this PR for must-fix issues only:
            - Bugs or logic errors in Kotlin code or workflows, including coroutine failures or error paths that silently swallow errors, and work that outlives its screen (polling, timers or jobs that are never cancelled)
            - Security issues: tokens or credentials in logs or UI, Authorization headers built outside HttpClientFactory and the Ktor Auth plugin or sent to non-API hosts, disabled TLS validation, overly-broad GH Actions permissions
            - Violations of CLAUDE.md's architecture invariants (e.g. token access outside TokenStore, refreshTokens without markAsRefreshTokenRequest(), runBlocking on the main thread, a ViewModel passed to a composable, a ViewModel calling the API without a repository, user-visible strings outside strings.xml, focusable TV elements without a contentDescription)
            - New ViewModels without a ViewModel test

            Skip anything CI already enforces (detekt, unit tests, debug and release builds, gitleaks), skip everything under core/build/generated/ (generated by openapi-generator), and skip style, subjective, or hypothetical feedback. The runBlocking inside the DataSource.Factory lambda in PlayerViewModel is intentional: ExoPlayer calls it on its loader thread.

            Post inline comments for must-fix issues, then one top-level summary — explicitly say "looks good" if there are none. Don't manufacture issues to appear thorough.
          claude_args: |
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
