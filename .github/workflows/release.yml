name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-signed-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify signing secrets are set
        run: |
          missing=()
          [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ] && missing+=("RELEASE_KEYSTORE_BASE64")
          [ -z "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" ] && missing+=("RELEASE_KEYSTORE_PASSWORD")
          [ -z "${{ secrets.RELEASE_KEY_ALIAS }}" ] && missing+=("RELEASE_KEY_ALIAS")
          [ -z "${{ secrets.RELEASE_KEY_PASSWORD }}" ] && missing+=("RELEASE_KEY_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing signing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Decode signing keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.keystore"

      - name: Derive version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          IFS='.' read -r major minor patch <<< "$tag"
          code=$((major * 10000 + minor * 100 + patch))
          echo "name=$tag" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Build signed TV release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew :tv:assembleRelease

      - name: Remove keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.keystore"

      - name: Rename APK
        run: |
          mv tv/build/outputs/apk/release/*.apk \
            "tv/build/outputs/apk/release/stoganet-tv-v${{ steps.version.outputs.name }}.apk"

      - name: Upload APK to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" tv/build/outputs/apk/release/*.apk
