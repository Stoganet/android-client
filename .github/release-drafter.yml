name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🚀 Features'
    labels: ['feature']
  - title: '🐛 Bug Fixes'
    labels: ['fix']
  - title: '🔧 Chores'
    labels: ['chore']
autolabeler:
  - label: 'feature'
    title: ['/^feat(ure)?(\(.+\))?:/']
  - label: 'fix'
    title: ['/^fix(\(.+\))?:/']
  - label: 'chore'
    title: ['/^chore(\(.+\))?:/']
version-resolver:
  major:
    labels: ['major']
  minor:
    labels: ['feature']
  patch:
    labels: ['fix', 'chore']
  default: patch
template: |
  ## Changes

  $CHANGES
